<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test Stroop</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #111827;
			background: #ffffff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: #ffffff;
		}

		.screen {
			min-height: 100vh;
			display: none;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			gap: 24px;
			text-align: center;
			padding: 24px;
		}

		.screen.active {
			display: flex;
		}

		h1,
		p {
			margin: 0;
		}

		h1 {
			font-size: clamp(2rem, 5vw, 4rem);
		}

		button {
			border: 0;
			border-radius: 8px;
			padding: 14px 28px;
			font-size: 1.1rem;
			font-weight: bold;
			color: #ffffff;
			background: #2563eb;
			cursor: pointer;
		}

		button:hover {
			background: #1d4ed8;
		}

		button:focus-visible {
			outline: 3px solid #93c5fd;
			outline-offset: 3px;
		}

		#countdown {
			font-size: clamp(5rem, 20vw, 12rem);
			font-weight: bold;
		}

		#test-screen h1 {
			color: #dc2626;
		}

		#word-grid {
			display: grid;
			grid-template-columns: repeat(5, minmax(0, 1fr));
			grid-template-rows: repeat(10, 1fr);
			gap: 12px 28px;
			width: min(720px, 100%);
			font-size: clamp(1.1rem, 3vw, 1.75rem);
			font-weight: bold;
		}

		#word-grid.column-flow {
			grid-auto-flow: column;
		}

		.word {
			text-align: center;
		}

		.ink-word {
			text-align: center;
		}

		.color-rectangle {
			min-height: 42px;
			border-radius: 4px;
		}
	</style>
</head>
<body>
	<main>
		<section id="start-screen" class="screen active" aria-labelledby="start-title">
			<h1 id="start-title">Test Stroop</h1>
			<button id="start-button" type="button">Commencer le test</button>
		</section>

		<section id="countdown-screen" class="screen" aria-live="assertive">
			<p>Le test commence dans</p>
			<div id="countdown">3</div>
		</section>

		<section id="test-screen" class="screen" aria-labelledby="test-title">
			<h1 id="test-title" hidden>Épreuve A</h1>
			<div id="word-grid" aria-label="Suite de mots"></div>
		</section>

		<section id="end-screen" class="screen" aria-labelledby="end-title">
			<h1 id="end-title">Fin de la première épreuve</h1>
			<button id="continue-button" type="button" hidden></button>
		</section>
	</main>

	<script>
		const screens = document.querySelectorAll('.screen');
		const startButton = document.querySelector('#start-button');
		const continueButton = document.querySelector('#continue-button');
		const countdownElement = document.querySelector('#countdown');
		const testTitleElement = document.querySelector('#test-title');
		const endTitleElement = document.querySelector('#end-title');
		const wordGridElement = document.querySelector('#word-grid');
		const exerciseNames = ['A', 'B', 'C'];
		const continueLabels = [
			'Commencer la seconde épreuve',
			'Commencer la troisième épreuve'
		];
		const words = [
			'vert', 'vert', 'rouge', 'jaune', 'vert',
			'bleu', 'vert', 'bleu', 'vert', 'jaune',
			'bleu', 'vert', 'jaune', 'rouge', 'jaune',
			'jaune', 'jaune', 'jaune', 'bleu', 'jaune',
			'jaune', 'rouge', 'rouge', 'bleu', 'bleu',
			'vert', 'bleu', 'vert', 'rouge', 'bleu',
			'vert', 'jaune', 'bleu', 'vert', 'vert',
			'bleu', 'rouge', 'jaune', 'vert', 'rouge',
			'rouge', 'vert', 'jaune', 'bleu', 'rouge',
			'rouge', 'rouge', 'rouge', 'bleu', 'bleu'
		];
		const colors = [
			'jaune', 'bleu', 'vert', 'rouge', 'bleu',
			'bleu', 'rouge', 'rouge', 'vert', 'bleu',
			'vert', 'vert', 'jaune', 'jaune', 'vert',
			'rouge', 'jaune', 'jaune', 'bleu', 'rouge',
			'rouge', 'jaune', 'vert', 'bleu', 'jaune',
			'vert', 'vert', 'rouge', 'rouge', 'rouge',
			'bleu', 'bleu', 'jaune', 'rouge', 'rouge',
			'bleu', 'jaune', 'bleu', 'vert', 'rouge',
			'rouge', 'bleu', 'vert', 'jaune', 'vert',
			'bleu', 'vert', 'jaune', 'bleu', 'bleu'
		];
		const stroopPairs = [
			['bleu', 'vert'], ['vert', 'jaune'], ['vert', 'rouge'], ['bleu', 'jaune'], ['vert', 'jaune'],
			['rouge', 'vert'], ['rouge', 'vert'], ['bleu', 'vert'], ['bleu', 'rouge'], ['vert', 'rouge'],
			['jaune', 'bleu'], ['jaune', 'bleu'], ['rouge', 'bleu'], ['rouge', 'vert'], ['rouge', 'bleu'],
			['bleu', 'rouge'], ['jaune', 'vert'], ['vert', 'rouge'], ['rouge', 'jaune'], ['bleu', 'jaune'],
			['vert', 'bleu'], ['rouge', 'jaune'], ['vert', 'jaune'], ['jaune', 'rouge'], ['jaune', 'vert'],
			['jaune', 'jaune'], ['bleu', 'rouge'], ['rouge', 'jaune'], ['jaune', 'vert'], ['bleu', 'jaune'],
			['rouge', 'bleu'], ['vert', 'vert'], ['jaune', 'jaune'], ['vert', 'jaune'], ['jaune', 'rouge'],
			['jaune', 'rouge'], ['rouge', 'rouge'], ['jaune', 'vert'], ['jaune', 'vert'], ['vert', 'jaune'],
			['bleu', 'rouge'], ['jaune', 'vert'], ['bleu', 'rouge'], ['vert', 'vert'], ['vert', 'bleu'],
			['vert', 'bleu'], ['vert', 'jaune'], ['jaune', 'rouge'], ['rouge', 'bleu'], ['bleu', 'rouge']
		];
		const colorValues = {
			jaune: '#facc15',
			bleu: '#2563eb',
			vert: '#16a34a',
			rouge: '#dc2626',
			encre: '#111827'
		};
		let currentExercise = 0;

		function renderItems(items, itemRenderer, ariaLabel) {
			wordGridElement.replaceChildren();
			wordGridElement.classList.toggle('column-flow', currentExercise === 0);
			wordGridElement.setAttribute('aria-label', ariaLabel);
			items.forEach((item) => wordGridElement.append(itemRenderer(item)));
		}

		function createWordElement(word) {
			const wordElement = document.createElement('span');
			wordElement.className = 'word';
			wordElement.textContent = word;
			return wordElement;
		}

		function createRectangleElement(color) {
			const rectangleElement = document.createElement('div');
			rectangleElement.className = 'color-rectangle';
			rectangleElement.style.backgroundColor = colorValues[color];
			rectangleElement.setAttribute('aria-label', color);
			return rectangleElement;
		}

		function createStroopElement([word, ink]) {
			const wordElement = document.createElement('span');
			wordElement.className = 'ink-word';
			wordElement.textContent = word;
			wordElement.style.color = colorValues[ink];
			wordElement.setAttribute('aria-label', `${word}, encre ${ink}`);
			return wordElement;
		}

		function renderExercise() {
			const exerciseRenderers = [
				() => renderItems(words, createWordElement, 'Suite de mots'),
				() => renderItems(colors, createRectangleElement, 'Suite de rectangles colorés'),
				() => renderItems(stroopPairs, createStroopElement, 'Suite de mots colorés')
			];

			exerciseRenderers[currentExercise]();
		}

		function showScreen(screenId) {
			screens.forEach((screen) => {
				screen.classList.toggle('active', screen.id === screenId);
			});
		}

		function startTest() {
			startButton.disabled = true;
			continueButton.hidden = true;
			showScreen('countdown-screen');

			let countdown = 3;
			countdownElement.textContent = countdown;

			const countdownTimer = setInterval(() => {
				countdown -= 1;
				countdownElement.textContent = countdown;

				if (countdown === 0) {
					clearInterval(countdownTimer);
					startExercise();
				}
			}, 1000);
		}

		function startExercise() {
			testTitleElement.textContent = `Épreuve ${exerciseNames[currentExercise]}`;
			renderExercise();
			showScreen('test-screen');

			setTimeout(endExercise, 45000);
		}

		function endExercise() {
			endTitleElement.textContent = `Fin de l'épreuve ${exerciseNames[currentExercise]}`;
			showScreen('end-screen');

			setTimeout(() => {
				if (currentExercise < exerciseNames.length - 1) {
					continueButton.textContent = continueLabels[currentExercise];
					continueButton.hidden = false;
				}
			}, 10000);
		}

		function continueTest() {
			currentExercise += 1;
			continueButton.hidden = true;
			startTest();
		}

		startButton.addEventListener('click', startTest);
		continueButton.addEventListener('click', continueTest);
	</script>
</body>
</html>
